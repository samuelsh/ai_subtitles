{% extends "layout.html" %}
{% block content %}
<main class="page">
  <header class="page__header">
    <h1 class="page__title">AI Subtitles</h1>
    <p class="page__subtitle">Transcribe audio &amp; video files into subtitles with OpenAI Whisper.</p>
  </header>

  <noscript>
    <p class="notice notice--warn">JavaScript is disabled. You can still transcribe, but you won't see progress or inline errors.</p>
  </noscript>

  <form id="transcribe_form" action="/transcribe" method="post" enctype="multipart/form-data" class="card">
    <label class="dropzone" id="dropzone" for="audio_file" tabindex="0" aria-label="Choose a media file by clicking or dropping it here">
      <input type="file" id="audio_file" name="audio_file" accept=".mp3,.wav,.ogg,.m4a,.aac,.flac,.webm,.mp4" required hidden>
      <span class="dropzone__icon" aria-hidden="true">⬆</span>
      <span class="dropzone__text" id="dropzone_text">Drop a file here or click to browse</span>
      <span class="dropzone__hint">.mp3 · .wav · .ogg · .m4a · .aac · .flac · .mp4 — up to 2&nbsp;GiB</span>
    </label>

    <div class="fields">
      <div class="field">
        <label for="format" class="field__label">Download format</label>
        <select id="format" name="format" class="field__control">
          <option value="text">Text (.txt)</option>
          <option value="srt">SubRip Subtitle (.srt)</option>
          <option value="vtt">WebVTT (.vtt)</option>
          <option value="json">JSON (.json)</option>
        </select>
      </div>

      <div class="field">
        <label for="language" class="field__label">Language</label>
        <select id="language" name="language" class="field__control">
          <option value="en">English</option>
          <option value="ru">Russian</option>
          <option value="he">Hebrew</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="it">Italian</option>
          <option value="pt">Portuguese</option>
          <option value="ja">Japanese</option>
          <option value="zh">Chinese</option>
          <option value="ar">Arabic</option>
        </select>
      </div>
    </div>

    <div class="actions">
      <button type="submit" id="submit_btn" class="btn btn--primary" disabled>Transcribe &amp; download</button>
      <button type="button" id="cancel_btn" class="btn btn--ghost" hidden>Cancel</button>
    </div>

    <div class="progress" id="progress" role="status" aria-live="polite" hidden>
      <div class="progress__header">
        <span class="status__spinner" aria-hidden="true"></span>
        <span class="progress__label" id="progress_label">Uploading…</span>
        <span class="progress__elapsed" id="progress_elapsed">00:00</span>
      </div>
      <div class="progress__bar" aria-hidden="true">
        <div class="progress__fill" id="progress_fill"></div>
      </div>
      <div class="progress__meta" id="progress_meta"></div>
      <ol class="progress__log" id="progress_log" aria-live="off"></ol>
    </div>

    <p class="error" id="error" role="alert" hidden></p>
  </form>
</main>
{% endblock %}
